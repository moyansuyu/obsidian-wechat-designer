name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build -- production

      - name: Generate artifact attestation for main.js
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: main.js

      - name: Generate artifact attestation for styles.css
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: styles.css

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes \
              main.js manifest.json styles.css
          fi
